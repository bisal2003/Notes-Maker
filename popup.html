<!DOCTYPE html>
<html>

<head>
    <title>Oracle Screenshot Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <h2>Screenshot Tracker</h2>

    <!-- Folder name for organizing screenshots -->
    <div class="setting-group">
        <label for="folder">Folder Name</label>
        <input id="folder" type="text" placeholder="e.g. Java Lecture 3">
    </div>

    <!-- Interval setting -->
    <div class="setting-group">
        <label for="interval">Interval (seconds)</label>
        <input id="interval" type="number" value="10" min="3" max="300" step="1">
    </div>

    <!-- Control buttons -->
    <div class="button-group">
        <button id="start" class="btn btn-start">Start</button>
        <button id="stop" class="btn btn-stop" disabled>Stop</button>
    </div>

    <!-- Status indicator -->
    <div class="status-bar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Stopped</span>
    </div>

    <!-- Stats counters -->
    <div class="stats">
        <div class="stat-item">
            <span class="stat-label">Saved</span>
            <span class="stat-value" id="savedCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Skipped</span>
            <span class="stat-value" id="skippedCount">0</span>
        </div>
    </div>

    <!-- Notes section -->
    <div class="notes-section">
        <label for="noteInput">Quick Note</label>
        <textarea id="noteInput" rows="3" placeholder="Type a note for this lecture..."></textarea>
        <button id="saveNote" class="btn btn-note">Save Note</button>
    </div>

    <!-- Export button -->
    <button id="exportDoc" class="btn btn-export">📄 Export to Word</button>

    <script src="config.js"></script>
    <script src="popup.js"></script>

</body>

</html>
